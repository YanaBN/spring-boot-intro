databaseChangeLog:
  - changeSet:
      id: create-shopping-cart-table
      author: mateacademy
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: shopping_carts
            columnNames: user_id
            constraintName: pk_shopping_carts

        - addForeignKeyConstraint:
            baseTableName: shopping_carts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shopping_cart_user