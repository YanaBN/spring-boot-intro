databaseChangeLog:
  - changeSet:
      id: 06-create-categories-table
      author: mateacademy
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 06-create-books_categories-table
      author: mateacademy
      changes:
        - createTable:
            tableName: books_categories
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: books_categories
            columnNames: book_id, category_id
            constraintName: pk_books_categories

        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: book_id
            constraintName: fk_books_categories_book
            referencedTableName: books
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: category_id
            constraintName: fk_books_categories_category
            referencedTableName: categories
            referencedColumnNames: id
